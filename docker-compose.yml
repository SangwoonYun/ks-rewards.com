services:
  ks-rewards:
    build: .
    container_name: ks-rewards
    user: 0:0
    ports:
      - 4127:3000
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    # Secrets (admin credentials, JWT secret) go in .env.production, which is not committed.
    # See .env.example; the server refuses to start in production with placeholder secrets.
    env_file:
      - .env.production
    environment:
      - TZ=Asia/Seoul
      - NODE_ENV=production
      - PORT=3000
      - NUXT_DB_PATH=/app/data/ks-rewards.db
      - NUXT_RETRY_DELAY_MS=3000
      - NUXT_REDEEM_DELAY_MS=3000
      - NUXT_MIN_REQUEST_INTERVAL_MS=3000
      - NUXT_SEARCH_REQUEST_INTERVAL_MS=2000
      - NUXT_REDEMPTION_INTERVAL_MINUTES=15
      - NUXT_DISCOVERY_INTERVAL_MINUTES=5
      - NUXT_BACKUP_INTERVAL_HOURS=6
    restart: unless-stopped
